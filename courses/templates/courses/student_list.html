{% extends 'main/base.html' %}
{% load static %}

{% block headStyle %}
<link href="{% static 'main/datatables/css/dataTables.bootstrap4.min.css' %}" rel="stylesheet" type="text/css" />
{% endblock %}

{% block content %}
<section class="section">
    <div class="row">
        <div class="col-lg-12 order-2 order-sm-1 order-md-1">
            <div class="card">

                <div class="card-header d-flex justify-content-end gap-2">
                    <div class="flex items-center">
                        <a href="{% url 'student_create' %}"
                           class="btn btn-sm btn-primary"
                           data-bs-toggle="tooltip"
                           data-bs-placement="top"
                           title="Rejistu Estudante Foun">
                            <i class="bi bi-file-earmark-plus"></i>
                            Rejistu
                        </a>
                        <a href="{% url 'student_export_excel' %}"
                            class="btn btn-sm btn-success"
                            data-bs-toggle="tooltip"
                            title="Export Excel">
                                <i class="bi bi-file-earmark-excel"></i>
                                Excel
                            </a>
                    </div>
                </div>

                <div class="card-body py-3">
                    <div class="table-responsive">

                        <table id="document-table" class="table table-sm">
                            <thead>
                                <tr class="fw-bolder text-muted">
                                    <th class="min-w-130px">Nú. Registu</th>
                                    <th class="min-w-180px">Naran Kompletu</th>
                                    <th class="min-w-180px">Sexo</th>
                                    <th class="min-w-100px">Semester</th>
                                    <th class="min-w-180px">Programa Estudu</th>
                                    <th class="min-w-130px">Data Moris</th>
                                    <th class="min-w-180px">Email</th>
                                    <th class="min-w-130px">Telefone</th>
                                    <th class="min-w-130px">Hela Fatin</th>
                                    <th class="min-w-100px">Aksaun</th>
                                </tr>
                            </thead>
                        </table>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<script src="{% static 'main/assets/js/jquery.min.js' %}"></script>
<script src="{% static 'main/datatables/js/jquery.dataTables.min.js' %}" type="text/javascript"></script>
<script src="{% static 'main/datatables/js/dataTables.bootstrap4.min.js' %}" type="text/javascript"></script>

<script>
$(document).ready(function () {
    $('#document-table').DataTable({
        processing: true,
        serverSide: true,
        searching: true,

        ajax: {
            url: "{% url 'Student_serverside_data' %}"
        },

        columns: [
            { data: "reg_no" },
//             {
//     data: "full_name",
//     render: function(data, type, row) {
//         if (type === "display") {
//             return '<a href="{% url "student_detail" 0 %}"'.replace("0", row.id) +
//                    ' class="text-primary fw-bold">' + data + '</a>';
//         }
//         return data;
//     }
// },
            { data: "full_name" },
            { data: "sex" },
            { data: "education_semester" },
            { data: "study_program" },
            { data: "birth_date" },
            { data: "email" },
            { data: "phone" },
            { data: "address" },


            {
                data: null,
                orderable: false,
                searchable: false,
                defaultContent:
                    "<a href='#' class='btn-update btn btn-sm btn-outline-success'>" +
                    "<i class='bi bi-pencil-square'></i>" +
                    "</a>"
            }
        ],

        pageLength: 10,

        rowCallback: function(row, data) {
            $(row).find('.btn-update').on('click', function(e) {
                e.stopPropagation();
                window.location.href =
                    "{% url 'student_update' 0 %}".replace('0', data.id);
            });
        }
    });
});
</script>

{% endblock content %}

{% block script %}
{% endblock %}
