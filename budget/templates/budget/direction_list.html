					</div>
					
				</div>
            </div>
        </div>
        
    </div>
</section>
<script src="{% static 'main/assets/js/jquery.min.js' %}"></script>

		<script src="{% static 'main/datatables/js/jquery.dataTables.min.js' %}" type="text/javascript"></script>
		<script src="{% static 'main/datatables/js/dataTables.bootstrap4.min.js' %}" type="text/javascript"></script>

<script>
$(document).ready(function () {

    var table = $('#document-table').DataTable({
        processing: true,
        serverSide: true,
        searching: true,
        ajax: {
            url: "{% url 'Direction_serverside_data' %}",
            data: function (d) {
                d.search_kategoria = $('#search_kategoria').val();
                d.search_tipu = $('#search_tipu').val();
            }
        },
        columns: [
            { data: "name" },
            { data: "year_budget" },
             { 
        data: "total_amount",
        render: function(data, type, row) {
            if (type === 'display') {
                return '$' + parseFloat(data).toLocaleString();
            }
            return data;
        }
    },

    { 
        data: "remaining_amount",
        render: function(data, type, row) {
            if (type === 'display') {
                return '$' + parseFloat(data).toLocaleString();
            }
            return data;
        }
    },

    { 
        data: null,
        orderable: false,
        searchable: false,
        defaultContent: "<a href='#' class='btn-update btn btn-sm btn-outline-success'><i class='bi bi-pencil-square'></i></a>"
    }
],
        pageLength: 10,
        rowCallback: function(row, data) {
            // $(row).on('click', function() {
            //     window.location.href = "{% url 'ArchivalDetail' 0 %}".replace('0', data.hashed);
            // });
            $(row).find('.btn-update').on('click', function(e){
                e.stopPropagation();
                window.location.href = "{% url 'direction-edit' 0 %}".replace('0', data.id);
            });
        }
    });

    $.ajax({
        url: "{% url 'Direction_serverside_data' %}",
        dataType: 'json',
        success: function(response){
            let types = new Set();
            response.data.forEach(item => {
                if(item.tipu) types.add(item.tipu);
            });
            types.forEach(t => {
                $('#search_tipu').append(`<option value="${t}">${t}</option>`);
            });
        }
    });

    // Trigger redraw on dropdown change
    $('#search_kategoria, #search_tipu').on('change', function(){
        table.draw();
    });

    // Stop dropdown click from triggering row click
    $('#document-table thead').on('click', 'select', function(e){
        e.stopPropagation();
    });

});

</script>

{% endblock content %}
{% block script %}
{% endblock %}
