{% extends "konfigurasaun.html" %}
{% block config_content %}

<div class="card-body">
  <form class="py-5" method="POST">
    {% csrf_token %}

    <div class="row mb-3">
      <label class="col-md-4 col-lg-3 col-form-label">Profile Image</label>
      <div class="col-md-8 col-lg-9">
        {% if objects.logo %}
          <img src="{{ objects.logo.url }}" width="300" height="200">
        {% endif %}

        <div class="pt-2">
          <a href="#" data-bs-toggle="modal" data-bs-target="#uploadImage"
             class="btn btn-primary btn-sm">
             Update <i class="bi bi-upload"></i>
          </a>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <label class="col-md-4 col-lg-3 col-form-label">Naran</label>
      <div class="col-md-8 col-lg-9">
        <input name="name" type="text" class="form-control"
               value="{{ objects.name }}">
      </div>
    </div>

    <div class="row mb-3">
      <label class="col-md-4 col-lg-3 col-form-label">About</label>
      <div class="col-md-8 col-lg-9">
        <textarea name="about" class="form-control"
                  style="height:100px">{{ objects.about }}</textarea>
      </div>
    </div>

    <div class="row mb-3">
      <label class="col-md-4 col-lg-3 col-form-label">Sigla</label>
      <div class="col-md-8 col-lg-9">
        <input name="sigla" type="text" class="form-control"
               value="{{ objects.sigla }}">
      </div>
    </div>

    <div class="row mb-3">
      <label class="col-md-4 col-lg-3 col-form-label">Address</label>
      <div class="col-md-8 col-lg-9">
        <input name="address" type="text" class="form-control"
               value="{{ objects.enderesu }}">
      </div>
    </div>

    <div class="row mb-3">
      <label class="col-md-4 col-lg-3 col-form-label">Phone</label>
      <div class="col-md-8 col-lg-9">
        <input name="phone" type="text" class="form-control"
               value="{{ objects.nu_kontaktu }}">
      </div>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>

  </form>
</div>


<!-- IMAGE MODAL -->
<div class="modal fade" id="uploadImage">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Atualiza Imajen</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form action="{% url 'config-update-owner-image' %}"
            method="POST"
            enctype="multipart/form-data">
        {% csrf_token %}

        <div class="modal-body">
          <input type="file" name="updatedImage"
                 class="form-control" required
                 onchange="previewImage(event)">
          <br>
          <center><img id="output" width="200"/></center>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
          <button type="button" class="btn btn-secondary btn-sm"
                  data-bs-dismiss="modal">Close</button>
        </div>

      </form>

    </div>
  </div>
</div>

<script>
function previewImage(event){
  const img = document.getElementById('output');
  img.src = URL.createObjectURL(event.target.files[0]);
}
</script>

{% endblock %}
