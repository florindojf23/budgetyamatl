{% extends "konfigurasaun.html" %}
{% block config_content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-pencil-square"></i>
                Edit Funcionariu
            </div>

            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Naran</label>
                            <input type="text" class="form-control"
                                   name="name" value="{{ employee.name }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Diresaun</label>
                            <select class="form-control" name="subentity" required>
                                {% for s in subentities %}
                                    <option value="{{ s.id }}"
                                        {% if s.id == employee.subentity.id %}selected{% endif %}>
                                        {{ s.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Sexo</label>
                            <select class="form-control" name="sex">
                                <option value="Mane" {% if employee.sex == "Mane" %}selected{% endif %}>Mane</option>
                                <option value="Feto" {% if employee.sex == "Feto" %}selected{% endif %}>Feto</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Data Moris</label>
                            <input type="date" class="form-control"
                                   name="dob" value="{{ employee.dob|date:'Y-m-d' }}">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Fotografia</label>
                            <input type="file" class="form-control" name="image">
                        </div>
                    </div>

                    {% if employee.image %}
                    <div class="mb-3">
                        <label class="form-label">Current Photo</label><br>
                        <img src="{{ employee.image.url }}"
                             class="rounded border"
                             width="120">
                    </div>
                    {% endif %}

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'config-funcionariu' %}"
                           class="btn btn-secondary btn-sm">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm">
                            Update
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
