{% extends "konfigurasaun.html" %}
{% block config_content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-pencil-square"></i> Edit Docs Category
            </div>

            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Naran Docs Category</label>
                        <input type="text" class="form-control" name="name" value="{{ doc_cat.name }}" required>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'config-doc-cat' %}" class="btn btn-secondary btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-sm">Update</button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
